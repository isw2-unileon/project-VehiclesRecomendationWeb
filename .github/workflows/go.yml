name: Go CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: go build -v ./...

      - name: Test with race detection
        run: go test -v -race ./internal/...

      - name: Test coverage
        run: go test -coverprofile=coverage.out ./internal/core/... ./internal/adapters/handlers/...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out
