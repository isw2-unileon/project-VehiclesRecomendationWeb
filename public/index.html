<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Recommendation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800 font-sans">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Vehicle Recommendation System</h1>
            <div id="nav-user-status" class="text-sm font-medium">Not logged in</div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <div class="lg:col-span-1">
                <div class="bg-white p-5 rounded border border-gray-300 shadow-sm">
                    <div id="login-box">
                        <h2 class="text-lg font-bold border-b border-gray-200 pb-2 mb-4">Account Login</h2>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                        <input id="log-email" type="email"
                            class="w-full mb-4 p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input id="log-password" type="password"
                            class="w-full mb-4 p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500">
                        <button onclick="login()"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded mb-4 transition">Log
                            In</button>
                        <div class="text-center text-sm border-t border-gray-200 pt-4">
                            <span class="text-gray-500">Don't have an account?</span><br>
                            <button onclick="switchMode('register')" class="text-blue-600 hover:underline mt-1">Create
                                new account</button>
                        </div>
                    </div>

                    <div id="register-box" class="hidden">
                        <h2 class="text-lg font-bold border-b border-gray-200 pb-2 mb-4">Register Account</h2>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input id="reg-username" type="text"
                            class="w-full mb-3 p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                        <input id="reg-email" type="email"
                            class="w-full mb-3 p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input id="reg-password" type="password"
                            class="w-full mb-4 p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500">
                        <button onclick="register()"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded mb-4 transition">Register</button>
                        <div class="text-center text-sm border-t border-gray-200 pt-4">
                            <button onclick="switchMode('login')" class="text-blue-600 hover:underline">Back to
                                Login</button>
                        </div>
                    </div>

                    <div id="logged-in-section" class="hidden text-center py-4">
                        <p class="text-green-600 mb-4 font-medium">✓ Securely logged in.</p>
                        <button onclick="logout()"
                            class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded border border-gray-300 w-full transition">Log
                            Out</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 relative">

                <div id="lock-screen"
                    class="absolute inset-0 bg-gray-100 bg-opacity-90 flex flex-col items-center justify-center rounded border border-gray-300 z-20 backdrop-blur-sm">
                    <p class="text-gray-700 font-medium text-lg">System Locked</p>
                    <p class="text-gray-500 text-sm mt-1">Please log in to access the vehicle database.</p>
                </div>

                <div class="bg-white p-6 rounded border border-gray-300 shadow-sm mb-6">
                    <h2 class="text-xl font-bold border-b border-gray-200 pb-2 mb-4 text-gray-800">Database Search</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
                        <div>
                            <label class="text-sm font-medium text-gray-700 block mb-1">Brand</label>
                            <input id="search-brand" type="text" placeholder="e.g. BMW"
                                class="w-full p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500 text-sm">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-700 block mb-1">Fuel Type</label>
                            <select id="search-fuel"
                                class="w-full p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500 text-sm">
                                <option value="">-- All --</option>
                                <option value="Gasoline">Gasoline</option>
                                <option value="Diesel">Diesel</option>
                                <option value="Electric">Electric</option>
                                <option value="Hybrid">Hybrid</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-700 block mb-1">Max Price (€)</label>
                            <input id="search-price" type="number" placeholder="e.g. 50000"
                                class="w-full p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500 text-sm">
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-700 block mb-1">Min. Seats</label>
                            <input id="search-seats" type="number" placeholder="Any" min="1" max="9"
                                class="w-full p-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500 text-sm">
                        </div>
                    </div>

                    <div class="flex justify-end">
                        <button onclick="manualSearch()"
                            class="bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-6 rounded transition">Search
                            Database</button>
                    </div>

                    <div id="search-results"
                        class="mt-5 p-4 rounded border border-gray-200 bg-gray-50 hidden max-h-96 overflow-y-auto text-sm text-gray-700">
                    </div>
                </div>

                <div class="bg-white p-6 rounded border border-gray-300 shadow-sm">
                    <h2 class="text-xl font-bold border-b border-gray-200 pb-2 mb-4 text-gray-800">AI Recommender (Llama
                        3.1)</h2>
                    <p class="text-sm text-gray-600 mb-3">Describe your lifestyle and let our AI find the perfect match.
                    </p>
                    <textarea id="ai-prompt" rows="3" placeholder="I need a reliable car for a family of four..."
                        class="w-full mb-3 p-3 rounded border border-gray-300 focus:outline-none focus:border-blue-500 text-sm"></textarea>
                    <div class="flex justify-end">
                        <button onclick="askAI()"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded transition">Generate
                            Recommendation</button>
                    </div>
                    <div id="ai-response"
                        class="mt-5 p-4 rounded border border-blue-100 bg-blue-50 hidden min-h-[100px] whitespace-pre-wrap text-sm text-gray-800">
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        let token = localStorage.getItem("token") || "";

        window.onload = () => { if (token) toggleUI(true); };

        function switchMode(mode) {
            if (mode === 'register') {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('register-box').classList.remove('hidden');
            } else {
                document.getElementById('register-box').classList.add('hidden');
                document.getElementById('login-box').classList.remove('hidden');
            }
        }

        function toggleUI(isLoggedIn) {
            const navStatus = document.getElementById("nav-user-status");
            if (isLoggedIn) {
                document.getElementById("login-box").classList.add("hidden");
                document.getElementById("register-box").classList.add("hidden");
                document.getElementById("logged-in-section").classList.remove("hidden");
                document.getElementById("lock-screen").classList.add("hidden");
                navStatus.innerText = "Logged In";
            } else {
                switchMode('login');
                document.getElementById("logged-in-section").classList.add("hidden");
                document.getElementById("lock-screen").classList.remove("hidden");
                document.getElementById("search-results").classList.add("hidden");
                document.getElementById("ai-response").classList.add("hidden");
                navStatus.innerText = "Not logged in";
            }
        }

        async function register() {
            const username = document.getElementById("reg-username").value;
            const email = document.getElementById("reg-email").value;
            const password = document.getElementById("reg-password").value;

            if (!username || !email || !password) return alert("Please fill in all fields.");

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                if (res.ok) {
                    alert("Account registered! Please log in.");
                    switchMode('login');
                    document.getElementById("log-email").value = email;
                } else alert("Registration failed. Email or username might already exist.");
            } catch (error) { alert("Server connection error."); }
        }

        async function login() {
            const email = document.getElementById("log-email").value;
            const password = document.getElementById("log-password").value;

            if (!email || !password) return alert("Please enter email and password.");

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (res.ok) {
                    const data = await res.json();
                    token = data.token;
                    localStorage.setItem("token", token);
                    toggleUI(true);
                } else alert("Invalid credentials.");
            } catch (error) { alert("Server connection error."); }
        }

        function logout() {
            token = "";
            localStorage.removeItem("token");
            toggleUI(false);
        }

        // --- MANUAL SEARCH ---
        async function manualSearch() {
            const brand = document.getElementById("search-brand").value;
            const fuel = document.getElementById("search-fuel").value;
            const price = document.getElementById("search-price").value;
            const seats = document.getElementById("search-seats").value;

            const resultsBox = document.getElementById("search-results");
            resultsBox.classList.remove("hidden");
            resultsBox.innerHTML = "<div class='text-center py-4'>Searching database... ⏳</div>";

            let queryParams = new URLSearchParams();
            if (brand) queryParams.append("brand", brand);
            // ¡AHORA MANDA EXACAMENTE fuel_type PARA TU HANDLER!
            if (fuel) queryParams.append("fuel_type", fuel);
            if (price) queryParams.append("max_price", price);
            if (seats) queryParams.append("min_seats", seats);

            try {
                const res = await fetch(`/api/cars/search?${queryParams.toString()}`, {
                    method: 'GET'
                });

                if (res.ok) {
                    const cars = await res.json();
                    if (!cars || cars.length === 0) {
                        resultsBox.innerHTML = "<div class='text-center text-red-500 font-medium py-4'>0 records found matching your criteria.</div>";
                        return;
                    }

                    let html = `<p class="font-bold border-b pb-2 mb-4 text-gray-800">Results: ${cars.length} vehicles found</p><div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                    cars.forEach(car => {
                        const searchImgQuery = encodeURIComponent(`${car.brand} ${car.model} car`);
                        const imageLink = `https://www.google.com/search?tbm=isch&q=${searchImgQuery}`;

                        html += `
                        <div class="bg-white border border-gray-200 rounded p-4 shadow-sm hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-gray-900">${car.brand} <br><span class="text-blue-600 font-normal">${car.model}</span></h3>
                                <a href="${imageLink}" target="_blank" class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-semibold py-1 px-2 rounded transition">📸 Photo</a>
                            </div>
                            <div class="text-sm grid grid-cols-2 gap-1 text-gray-600 mt-2">
                                <div><span class="font-medium">Fuel:</span> ${car.fuel_type || car.FuelType || '-'}</div>
                                <div><span class="font-medium">Seats:</span> ${car.seats || car.Seats || '-'}</div>
                            </div>
                            <div class="mt-3 pt-2 border-t border-gray-100 font-bold text-green-700">${car.price || car.Price ? '€' + (car.price || car.Price).toLocaleString() : 'Price upon request'}</div>
                        </div>`;
                    });
                    html += `</div>`;
                    resultsBox.innerHTML = html;
                } else {
                    resultsBox.innerHTML = "<div class='text-center text-red-500 py-4'>Backend Error: Could not retrieve data.</div>";
                }
            } catch (e) {
                resultsBox.innerHTML = "<div class='text-center text-red-500 py-4'>Connection Error: Failed to reach the backend.</div>";
            }
        }

        // --- AI RECOMMENDER ---
        async function askAI() {
            const prompt = document.getElementById("ai-prompt").value;
            if (!prompt) return alert("Please provide input for the AI.");

            const responseBox = document.getElementById("ai-response");
            responseBox.classList.remove("hidden");
            responseBox.innerText = "Processing natural language and querying database...";

            try {
                const res = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ preferences: prompt })
                });
                const data = await res.json();
                responseBox.innerText = data.recommendation || "System Error: " + data.error;
            } catch (e) {
                responseBox.innerText = "Connection Error: Failed to reach the backend.";
            }
        }
    </script>
</body>

</html>
