services:
  - type: web
    name: vehicles-recommendation-web
    env: go
    buildCommand: go build -o server ./cmd/api
    startCommand: ./server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vehicles-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

databases:
  - name: vehicles-db
    databaseName: cars
    user: postgres